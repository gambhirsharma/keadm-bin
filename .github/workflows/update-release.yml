name: Check for KubeEdge Updates

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  check-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Get latest KubeEdge release
        id: latest
        run: |
          LATEST=$(curl -s https://api.github.com/repos/kubeedge/kubeedge/releases/latest | jq -r '.tag_name' | sed 's/^v//')
          echo "version=$LATEST" >> "$GITHUB_OUTPUT"
          echo "Latest KubeEdge release: $LATEST"

      - name: Get current package version
        id: current
        run: |
          CURRENT=$(grep '^pkgver=' PKGBUILD | cut -d= -f2)
          echo "version=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "Current package version: $CURRENT"

      - name: Compare versions
        id: compare
        run: |
          if [ "${{ steps.latest.outputs.version }}" != "${{ steps.current.outputs.version }}" ]; then
            echo "update_needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "update_needed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release branch and update
        if: steps.compare.outputs.update_needed == 'true'
        run: |
          NEW_VER="${{ steps.latest.outputs.version }}"
          BRANCH_NAME="rl/v${NEW_VER}"

          # Create and switch to release branch from master
          git checkout -b "$BRANCH_NAME"

          # Update PKGBUILD
          sed -i "s/^pkgver=.*/pkgver=$NEW_VER/" PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=1/" PKGBUILD

          # Download tarballs and compute sha512sums
          for arch in amd64 arm64 arm; do
            URL="https://github.com/kubeedge/kubeedge/releases/download/v${NEW_VER}/keadm-v${NEW_VER}-linux-${arch}.tar.gz"
            curl -sL "$URL" -o "keadm-v${NEW_VER}-linux-${arch}.tar.gz"
          done

          SHA_AMD64=$(sha512sum "keadm-v${NEW_VER}-linux-amd64.tar.gz" | awk '{print $1}')
          SHA_ARM64=$(sha512sum "keadm-v${NEW_VER}-linux-arm64.tar.gz" | awk '{print $1}')
          SHA_ARM=$(sha512sum "keadm-v${NEW_VER}-linux-arm.tar.gz" | awk '{print $1}')

          sed -i "s/sha512sums_x86_64=.*/sha512sums_x86_64=('$SHA_AMD64')/" PKGBUILD
          sed -i "s/sha512sums_aarch64=.*/sha512sums_aarch64=('$SHA_ARM64')/" PKGBUILD
          sed -i "s/sha512sums_armv7h=.*/sha512sums_armv7h=('$SHA_ARM')/" PKGBUILD

          sed -i "s|releases/download/v.*keadm-v.*-linux-amd64|releases/download/v${NEW_VER}/keadm-v${NEW_VER}-linux-amd64|g" PKGBUILD
          sed -i "s|releases/download/v.*keadm-v.*-linux-arm64|releases/download/v${NEW_VER}/keadm-v${NEW_VER}-linux-arm64|g" PKGBUILD
          sed -i "s|releases/download/v.*keadm-v.*-linux-arm|releases/download/v${NEW_VER}/keadm-v${NEW_VER}-linux-arm|g" PKGBUILD

          # Regenerate .SRCINFO
          cat > .SRCINFO << EOF
         pkgbase = keadm-bin
         	pkgdesc = KubeEdge installer tool for setting up cloud and edge components (prebuilt binary)
         	pkgver = $NEW_VER
         	pkgrel = 1
         	url = https://kubeedge.io
         	arch = x86_64
         	arch = aarch64
         	arch = armv7h
         	license = Apache-2.0
         	options = !strip
         	options = !debug
         	source_x86_64 = https://github.com/kubeedge/kubeedge/releases/download/v${NEW_VER}/keadm-v${NEW_VER}-linux-amd64.tar.gz
         	sha512sums_x86_64 = $SHA_AMD64
         	source_aarch64 = https://github.com/kubeedge/kubeedge/releases/download/v${NEW_VER}/keadm-v${NEW_VER}-linux-arm64.tar.gz
         	sha512sums_aarch64 = $SHA_ARM64
         	source_armv7h = https://github.com/kubeedge/kubeedge/releases/download/v${NEW_VER}/keadm-v${NEW_VER}-linux-arm.tar.gz
         	sha512sums_armv7h = $SHA_ARM

         pkgname = keadm-bin
         EOF

          # Clean up
          rm -f keadm-v${NEW_VER}-linux-*.tar.gz

          # Push release branch
          git add PKGBUILD .SRCINFO
          git commit -m "Update keadm-bin to v${NEW_VER}"
          git push github "$BRANCH_NAME"

      - name: Create Pull Request
        if: steps.compare.outputs.update_needed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NEW_VER="${{ steps.latest.outputs.version }}"
          BRANCH_NAME="rl/v${NEW_VER}"

          gh pr create \
            --repo gambhirsharma/keadm-bin \
            --base master \
            --head "$BRANCH_NAME" \
            --title "Update keadm-bin to v${NEW_VER}" \
            --body "Automated update for KubeEdge v${NEW_VER}

          Release: https://github.com/kubeedge/kubeedge/releases/tag/v${NEW_VER}

          Changes:
          - Updated pkgver to ${NEW_VER}
          - Updated sha512sums for all architectures
          - Updated source URLs"
